[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

# --------------------------------------------------------------------- project

[project]
name = "agentic-paper"
dynamic = ["version"]
description = "A multi-agent LLM orchestrator for academic peer-review."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Alberto G. Gerli", email = "alberto@albertogerli.it" },
]
maintainers = [
    { name = "Alberto G. Gerli", email = "alberto@albertogerli.it" },
]
requires-python = ">=3.10"
keywords = [
    "peer-review",
    "multi-agent",
    "llm",
    "agentic",
    "openai",
    "anthropic",
    "gemini",
    "ollama",
    "scientific-writing",
    "reviewer",
    "research-tools",
    "academic",
    "openalex",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]

# Caret-style pins: major version cap, minor floor.
# Exact resolution is recorded in requirements-lock.txt.
dependencies = [
    "openai>=1.60.0,<3.0.0",        # also used for any OpenAI-compatible endpoint (Ollama / vLLM / LM Studio)
    "anthropic>=0.40.0,<1.0.0",
    "google-genai>=1.51.0,<2.0.0",
    "pdfplumber>=0.10.3,<1.0.0",
    "tenacity>=8.2.3,<10.0.0",
    "pyyaml>=6.0.1,<7.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "python-dateutil>=2.8.2,<3.0.0",
    "httpx>=0.27.0,<1.0.0",         # OpenAlex citation validator (no API key required)
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.27.0,<1.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "jinja2>=3.1.0,<4.0.0",
    "markdown>=3.5.0,<4.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "reportlab>=4.0.0",   # tests/_make_pdf.py
    "httpx>=0.27.0",      # FastAPI TestClient
    # web extras pulled in so the FastAPI test module can import
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.27.0,<1.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "jinja2>=3.1.0,<4.0.0",
    "markdown>=3.5.0,<4.0.0",
]

[project.urls]
Homepage      = "https://github.com/albertogerli/Agentic_Paper"
Repository    = "https://github.com/albertogerli/Agentic_Paper"
Issues        = "https://github.com/albertogerli/Agentic_Paper/issues"
Changelog     = "https://github.com/albertogerli/Agentic_Paper/blob/main/CHANGELOG.md"
Documentation = "https://github.com/albertogerli/Agentic_Paper#readme"

[project.scripts]
agentic-paper = "agentic_paper.cli:main"
agentic-paper-web = "agentic_paper.web.server:run_main"

# ----------------------------------------------------------------- hatchling

[tool.hatch.version]
path = "agentic_paper/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["agentic_paper"]
# Non-Python data (HTML templates, bundled R script, etc.) is picked up
# automatically because it lives inside the package tree.

[tool.hatch.build.targets.sdist]
include = [
    "/agentic_paper",
    "/data/fixtures/sample_paper.pdf",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/config_example.yaml",
    "/pyproject.toml",
]
exclude = [
    "/tests",
    "/.github",
    "/output_paper_review",
    "/ASSESSMENT.md",
    "/REFACTOR_PLAN.md",
    "/R_COMPONENT_DECISION.md",
    "**/__pycache__",
    "**/*.pyc",
]

# ------------------------------------------------------------------- pytest

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "strict"

# ------------------------------------------------------------------- coverage

[tool.coverage.run]
source = ["agentic_paper"]
omit = [
    "agentic_paper/providers/stub_provider.py",  # test-only
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
