# Example configuration for the multi-agent paper review system
# File: config_example.yaml
#
# Three layers, from least to most specific:
#   1. providers:  which API endpoints exist + how to authenticate.
#   2. routing:    which (provider, model, thinking_budget) handles
#                  each complexity tier (low / standard / high).
#   3. agents:     per-agent overrides.
#
# ============================================
# AVAILABLE MODELS (as of May 2026)
# ============================================
# Pick any of these for `model:` fields below. New releases work too —
# the catalog (agentic_paper/models.py) infers reasoning style from the
# model name prefix.
#
# OpenAI (Responses API for reasoning tier; reasoning.effort = low|medium|high|xhigh):
#   gpt-5.5            — flagship (default for tier_high)
#   gpt-5.5-pro        — higher-accuracy variant
#   gpt-5.4-mini       — smaller/faster (default for tier_standard)
#   gpt-5              — previous flagship
#   gpt-5-mini
#   o4-mini            — fast reasoning
#   o3                 — earlier reasoning
#   gpt-4o, gpt-4o-mini (non-reasoning)
#
# Anthropic (Messages API; thinking={type:adaptive} on 4.6+):
#   claude-opus-4-7    — most capable
#   claude-sonnet-4-6  — balanced (recommended)
#   claude-haiku-4-5   — fast + cheap
#
# Google (Gemini 3.x uses thinking_level=low|medium|high; 2.x uses thinking_budget int):
#   gemini-3-pro
#   gemini-3.1-pro-preview
#   gemini-3-flash
#   gemini-3.1-flash-lite
#   gemini-3.1-flash-lite

# ============================================
# PROVIDERS
# ============================================
# Set credentials per provider. Use `api_key_env` (recommended) or
# `api_key` directly. For OpenAI-compatible local servers, set
# `base_url` and the registry treats unknown names as openai_compat.

providers:
  openai:
    api_key_env: OPENAI_API_KEY
  anthropic:
    api_key_env: ANTHROPIC_API_KEY
  google:
    api_key_env: GOOGLE_API_KEY
  # Example local-model endpoint (uncomment to use):
  # ollama:
  #   base_url: "http://localhost:11434/v1"
  #   api_key: "ollama"

# ============================================
# ROUTING
# ============================================
# Tier-based defaults. Combined complexity score per agent:
#   score = 0.4 * paper_complexity + 0.6 * agent_base_complexity
# Picks tier_high (≥0.65), tier_standard (≥0.45), or tier_basic.
#
# `thinking_budget` may be an int (token budget; mapped per provider)
# or "auto". Ignored on non-reasoning models.

routing:
  tier_high:
    provider: anthropic
    model: claude-opus-4-7
    thinking_budget: auto       # → adaptive thinking on 4.6+ models
  tier_standard:
    provider: openai
    model: gpt-5.4-mini
    thinking_budget: medium      # → reasoning_effort = medium
  tier_basic:
    provider: google
    model: gemini-3.1-flash-lite

# ============================================
# PER-AGENT OVERRIDES (optional)
# ============================================
agents:
  methodology:
    provider: anthropic
    model: claude-opus-4-7
    thinking_budget: auto
  contradiction:
    provider: anthropic
    model: claude-sonnet-4-6
    thinking_budget: auto
  results:
    provider: openai
    model: gpt-5.5
    thinking_budget: high
  structure:
    provider: google
    model: gemini-3.1-flash-lite
  # ai_origin, hallucination, ethics, literature, impact:
  # fall through to tier defaults above.

# ============================================
# TEMPERATURE (per-agent)
# ============================================
# NOTE: extended/adaptive thinking forces temperature=1.0 internally.
# For non-reasoning models, drop these to 0.2-0.4 for analytic tasks.

temperature_methodology: 1.0
temperature_results: 1.0
temperature_literature: 1.0
temperature_structure: 1.0
temperature_impact: 1.0
temperature_contradiction: 1.0
temperature_ethics: 1.0
temperature_coordinator: 1.0
temperature_editor: 1.0
temperature_ai_origin: 1.0
temperature_hallucination: 1.0

# ============================================
# OUTPUT
# ============================================
max_output_tokens: 16000
output_dir: "output_paper_review"

# ============================================
# PARALLELISM
# ============================================
# Match to the strictest rate-limit tier across your registered providers.
max_parallel_agents: 6
agent_timeout: 600

# ============================================
# PROMPT CACHING
# ============================================
# Anthropic: explicit `cache_control` blocks on system + user (handled per call).
# OpenAI:    automatic server-side (Responses API has best cache hit-rate).
# Google:    no explicit per-request caching today.
use_prompt_caching: true

# ============================================
# LEGACY FIELDS (used only when `routing` is absent)
# ============================================
model_powerful: "gpt-5.4-mini"
model_standard: "gpt-5.4-mini"
model_basic: "gpt-5.4-mini"
reasoning_effort: "medium"   # CLI back-compat, not consumed
