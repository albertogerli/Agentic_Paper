name: Release

# Tag-driven PyPI release. Push a tag `vX.Y.Z` matching the `__version__`
# in agentic_paper/__init__.py to trigger a build + publish.
#
# Authentication uses PyPI's Trusted Publishing (OIDC). Configure the
# trusted publisher at https://pypi.org/manage/account/publishing/ for
# project `agentic-paper`, repo `albertogerli/Agentic_Paper`, workflow
# `release.yml`, environment `pypi`. No PYPI_API_TOKEN secret needed.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        # enable-cache requires a uv.lock; this project locks via
        # requirements-lock.txt (pip-compile style), not uv, so we leave the
        # cache off rather than fabricate a uv.lock that nobody else uses.
        uses: astral-sh/setup-uv@v7

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Build distributions
        run: |
          uv build
          ls -lah dist/

      - name: Verify metadata
        # uvx fetches twine in an ephemeral env — avoids hitting the
        # externally-managed system Python on the GH runners (PEP 668).
        run: uvx twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/agentic-paper
    permissions:
      id-token: write   # OIDC for trusted publishing

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # No `password:` — trusted publishing handles auth via OIDC.

  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'dev') || contains(github.ref_name, 'rc') || contains(github.ref_name, 'a') || contains(github.ref_name, 'b') }}
